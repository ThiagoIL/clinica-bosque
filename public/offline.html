<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#667b35">
  <title>Sem conexão · Clínica Bosque</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
      background: #f6f5f2; color: #26231f;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main { max-width: 22rem; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 50%; }
    h1 { margin: 1rem 0 .5rem; font-size: 1.25rem; }
    p { margin: 0 0 1.5rem; color: #6f6c66; line-height: 1.5; }
    button {
      border: 0; border-radius: .5rem; padding: .7rem 1.4rem; font-size: 1rem; font-weight: 600;
      background: #667b35; color: #fff; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Sem conexão</h1>
    <p>Não foi possível falar com o sistema. Confira a internet do celular e tente de novo. Por segurança, nenhum dado da clínica fica guardado no aparelho.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
